<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>HangMan — Visa Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-pattern"></div>

<main id="box" class="passport-card">
    <header class="card-header">
        <div class="stamp" aria-hidden="true">VISA</div>
        <p id="eyebrow">Visa Control</p>
        <h1 id="title">Identify the Country</h1>
    </header>

    <div id="d1" class="photo-frame">
        <div id="pic_box" class="photo-blur"></div>
        <div class="photo-overlay"></div>
        <div class="photo-label">CLASSIFIED</div>
    </div>

    <div class="lives-bar">
        <span class="lives-label">Attempts remaining</span>
        <div id="lives" class="lives-dots" aria-label="Remaining attempts"></div>
    </div>

    <div id="heder" class="word-tiles" role="group" aria-label="Word to guess"></div>

    <div id="d2" class="footer-area">
        <p id="hint">Type a letter to guess</p>
        <div id="wrong-letters" class="wrong-letters" aria-label="Wrong guesses"></div>
        <button id="restart" type="button" hidden>Play Again</button>
    </div>
</main>

<script src="code.js"></script>
</body>
</html>
