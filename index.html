<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="theme-color" media="(min-width: 641px)" content="#0C0C0E">
    <meta name="theme-color" media="(max-width: 640px)" content="#000000">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

    <title>Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">


    <div class="sticky-top">
        <header class="hero">
            <h1>Project</h1>
        </header>

        <div class="listHead">
            <div class="search-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                <input id="search" type="search" placeholder="Search projects" aria-label="Search projects" autocomplete="off">
            </div>
        </div>
    </div>


    <div id="projects" class="box"></div>

    <div id="empty" class="empty">No project matches your search.</div>


    <div class="footer">
        <span class="footer-credit">Designed By @mojtaba</span>
        <span class="footer-version">Version 2.9</span>
    </div>

    <div class="page-end-glow" aria-hidden="true"></div>

</div>

<div id="pilot" class="pilot" data-active="false">
    <div class="pilot-menu" id="pilot-menu" role="listbox" aria-label="Suggestions" hidden></div>
    <div class="pilot-bar">
        <div class="pilot-lead" id="pilot-lead" aria-hidden="true">
            <svg class="pilot-soft-tri" viewBox="0 0 24 24"><path d="M9.2 5.8c0-1 1.1-1.6 1.9-1.1l9 5.7c.8.5.8 1.7 0 2.2l-9 5.7c-.8.5-1.9-.1-1.9-1.1V5.8z"/></svg>
        </div>
        <div class="pilot-field">
            <input
                id="pilot-input"
                class="pilot-input"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="Type a command…"
                aria-label="Pilot commands"
                tabindex="-1"
            >
        </div>
    </div>
</div>

<script src="pilot.js"></script>
<script src="code.js"></script>
</body>
</html>
